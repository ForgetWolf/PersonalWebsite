<main class="coverflow" aria-label="Friends Cover Flow">
<input class="cover-state" type="radio" name="cover" id="cover-1" aria-label="@@FRIEND_LABEL_0@@">
<input class="cover-state" type="radio" name="cover" id="cover-2" aria-label="@@FRIEND_LABEL_1@@">
<input class="cover-state" type="radio" name="cover" id="cover-3" aria-label="@@FRIEND_LABEL_2@@" checked>
<input class="cover-state" type="radio" name="cover" id="cover-4" aria-label="@@FRIEND_LABEL_3@@">
<input class="cover-state" type="radio" name="cover" id="cover-5" aria-label="偏航">
<div class="cover-stage">
<article class="cover" style="--cover-border: @@FRIEND_COLOR_0@@">
    <picture class="cover-pixels"><source media="(prefers-color-scheme: dark)" srcset="../favicon/@@FRIEND_ICON_DARK_0@@"><img src="../favicon/@@FRIEND_ICON_LIGHT_0@@" alt=""></picture>
    <a class="cover-link" href="@@FRIEND_URL_0@@" aria-label="访问 @@FRIEND_LABEL_0@@"></a>
    <label class="cover-select" for="cover-1" aria-hidden="true"></label>
</article>
<article class="cover" style="--cover-border: @@FRIEND_COLOR_1@@">
    <picture class="cover-pixels"><source media="(prefers-color-scheme: dark)" srcset="../favicon/@@FRIEND_ICON_DARK_1@@"><img src="../favicon/@@FRIEND_ICON_LIGHT_1@@" alt=""></picture>
    <a class="cover-link" href="@@FRIEND_URL_1@@" aria-label="访问 @@FRIEND_LABEL_1@@"></a>
    <label class="cover-select" for="cover-2" aria-hidden="true"></label>
</article>
<article class="cover" style="--cover-border: @@FRIEND_COLOR_2@@">
    <picture class="cover-pixels"><source media="(prefers-color-scheme: dark)" srcset="../favicon/@@FRIEND_ICON_DARK_2@@"><img src="../favicon/@@FRIEND_ICON_LIGHT_2@@" alt=""></picture>
    <a class="cover-link" href="@@FRIEND_URL_2@@" aria-label="访问 @@FRIEND_LABEL_2@@"></a>
    <label class="cover-select" for="cover-3" aria-hidden="true"></label>
</article>
<article class="cover" style="--cover-border: @@FRIEND_COLOR_3@@">
    <picture class="cover-pixels"><source media="(prefers-color-scheme: dark)" srcset="../favicon/@@FRIEND_ICON_DARK_3@@"><img src="../favicon/@@FRIEND_ICON_LIGHT_3@@" alt=""></picture>
    <a class="cover-link" href="@@FRIEND_URL_3@@" aria-label="访问 @@FRIEND_LABEL_3@@"></a>
    <label class="cover-select" for="cover-4" aria-hidden="true"></label>
</article>
<article class="cover">
    <picture><source media="(prefers-color-scheme: dark)" srcset="../favicon/monet-dark.jpg"><img src="../favicon/monet-light.jpg" alt=""></picture>
    <a class="cover-link random-link" style="--destination: 0" href="@@FRIEND_URL_0@@" aria-label="偏航：访问 @@FRIEND_LABEL_0@@"></a>
    <a class="cover-link random-link" style="--destination: 1" href="@@FRIEND_URL_1@@" aria-label="偏航：访问 @@FRIEND_LABEL_1@@"></a>
    <a class="cover-link random-link" style="--destination: 2" href="@@FRIEND_URL_2@@" aria-label="偏航：访问 @@FRIEND_LABEL_2@@"></a>
    <a class="cover-link random-link" style="--destination: 3" href="@@FRIEND_URL_3@@" aria-label="偏航：访问 @@FRIEND_LABEL_3@@"></a>
    <label class="cover-select" for="cover-5" aria-hidden="true"></label>
</article>
</div>
<div class="cover-names" lang="zh-Hans">
    <span>@@FRIEND_NAME_0@@</span>
    <span>@@FRIEND_NAME_1@@</span>
    <span>@@FRIEND_NAME_2@@</span>
    <span>@@FRIEND_NAME_3@@</span>
    <span>偏航</span>
</div>
</main>
